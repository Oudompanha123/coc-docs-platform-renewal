openapi: 3.0.1
info:
  title: Coc Docs Platform API
  description: "REST API for documentation content, navigation, media and accounts."
  version: v1
servers:
- url: http://localhost:8081
  description: Generated server url
security:
- cookieAuth: []
paths:
  /api/v1/admin/pages/{pageId}/versions/{locale}/draft:
    put:
      tags:
      - admin-content-controller
      operationId: saveDraft
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: locale
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/auth/reset-password:
    post:
      tags:
      - auth-controller
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
  /api/v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /api/v1/auth/nonce:
    post:
      tags:
      - auth-controller
      operationId: nonce
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NonceResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: signOut
      responses:
        "200":
          description: OK
  /api/v1/auth/login-password:
    post:
      tags:
      - auth-controller
      operationId: signInWithPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/auth/google:
    post:
      tags:
      - auth-controller
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/auth/forgot-password:
    post:
      tags:
      - auth-controller
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"
  /api/v1/admin/pages/{pageId}/versions/{locale}/publish:
    post:
      tags:
      - admin-content-controller
      operationId: publish
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: locale
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/admin/pages/{pageId}/versions/{locale}/open:
    post:
      tags:
      - admin-content-controller
      operationId: open
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: locale
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/admin/content/validate:
    post:
      tags:
      - admin-content-controller
      operationId: validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ValidateResponse"
  /api/v1/admin/accounts:
    get:
      tags:
      - admin-account-controller
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponse"
    post:
      tags:
      - admin-account-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/v1/admin/accounts/{accountId}/reject:
    post:
      tags:
      - admin-account-controller
      operationId: reject
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountSummary"
  /api/v1/admin/accounts/{accountId}/approve:
    post:
      tags:
      - admin-account-controller
      operationId: approve
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountSummary"
  /api/v1/auth/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      tags:
      - auth-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/admin/accounts/{accountId}:
    patch:
      tags:
      - admin-account-controller
      operationId: update
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/v1/sections:
    get:
      tags:
      - content-controller
      operationId: sections
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionResponse"
  /api/v1/sections/{sectionSlug}/pages:
    get:
      tags:
      - content-controller
      operationId: navigation
      parameters:
      - name: sectionSlug
        in: path
        required: true
        schema:
          type: string
      - name: locale
        in: query
        required: false
        schema:
          type: string
          default: en
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NavEntryResponse"
  /api/v1/pages/{sectionSlug}/{pageSlug}:
    get:
      tags:
      - content-controller
      operationId: page
      parameters:
      - name: sectionSlug
        in: path
        required: true
        schema:
          type: string
      - name: pageSlug
        in: path
        required: true
        schema:
          type: string
      - name: locale
        in: query
        required: false
        schema:
          type: string
          default: en
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/sessions:
    get:
      tags:
      - auth-controller
      operationId: sessions
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponse"
  /api/v1/admin/translation-status:
    get:
      tags:
      - admin-content-controller
      operationId: translationStatus
      parameters:
      - name: section
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TranslationStatusResponse"
  /api/v1/admin/roles:
    get:
      tags:
      - admin-role-controller
      operationId: list_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleResponse"
  /api/v1/admin/pages/{pageId}/versions/{locale}/history:
    get:
      tags:
      - admin-content-controller
      operationId: history
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: locale
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VersionSummaryResponse"
  /api/v1/admin/accounts/pending:
    get:
      tags:
      - admin-account-controller
      operationId: pending
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags:
      - auth-controller
      operationId: revokeSession
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /api/v1/admin/pages/{pageId}:
    delete:
      tags:
      - admin-content-controller
      operationId: delete
      parameters:
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
components:
  schemas:
    JsonNode:
      type: object
    SaveDraftRequest:
      required:
      - body
      - title
      - versionNo
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        body:
          $ref: "#/components/schemas/JsonNode"
        versionNo:
          type: integer
          format: int32
    VersionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        locale:
          type: string
        status:
          type: string
        title:
          type: string
        description:
          type: string
        body:
          $ref: "#/components/schemas/JsonNode"
        versionNo:
          type: integer
          format: int32
        sourceVersionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResetPasswordRequest:
      required:
      - newPassword
      - token
      type: object
      properties:
        token:
          type: string
          description: The opaque token from the emailed reset link.
        newPassword:
          maxLength: 200
          minLength: 8
          type: string
          description: Plaintext in transit only — hashed (bcrypt) before it ever
            reaches the database.
    ResetPasswordResponse:
      type: object
      properties:
        message:
          type: string
    RegisterRequest:
      required:
      - displayName
      - email
      - password
      type: object
      properties:
        email:
          type: string
          description: The applicant's email address.
        displayName:
          type: string
          description: Display name shown immediately in the new account.
        password:
          maxLength: 200
          minLength: 8
          type: string
          description: Plaintext in transit only — hashed (bcrypt) before it ever
            reaches the database.
    RegisterResponse:
      type: object
      properties:
        status:
          type: string
          description: "Always ACTIVE: the account can sign in immediately, no approval\
            \ step."
        message:
          type: string
    NonceResponse:
      type: object
      properties:
        nonce:
          type: string
    PasswordLoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          description: Plaintext in transit only — checked against the stored bcrypt
            hash server-side.
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
        avatarUrl:
          type: string
        authenticated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSignInAt:
          type: string
          format: date-time
    GoogleSignInRequest:
      required:
      - idToken
      type: object
      properties:
        idToken:
          type: string
    ForgotPasswordRequest:
      required:
      - email
      type: object
      properties:
        email:
          type: string
    ForgotPasswordResponse:
      type: object
      properties:
        message:
          type: string
          description: The same text whether or not the address has an account with
            a password.
    ValidateRequest:
      required:
      - body
      type: object
      properties:
        body:
          $ref: "#/components/schemas/JsonNode"
    IssueResponse:
      type: object
      properties:
        path:
          type: string
        message:
          type: string
    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/IssueResponse"
    CreateAccountRequest:
      required:
      - email
      - role
      type: object
      properties:
        email:
          type: string
        role:
          type: string
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSignInAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
    AccountSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - GUEST
          - USER
          - ADMIN
          - SUPER_ADMIN
        status:
          type: string
          description: "PENDING, ACTIVE, or REJECTED — the registration/approval lifecycle,\
            \ ADR-014."
          enum:
          - PENDING
          - ACTIVE
          - REJECTED
    ApproveRequest:
      type: object
      properties:
        role:
          type: string
    UpdateProfileRequest:
      required:
      - displayName
      type: object
      properties:
        displayName:
          type: string
    UpdateAccountRequest:
      type: object
      properties:
        role:
          type: string
        active:
          type: boolean
        displayName:
          type: string
    SectionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        order:
          type: integer
          format: int32
        dbBacked:
          type: boolean
    NavEntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        order:
          type: integer
          format: int32
        badge:
          type: string
        title:
          type: string
    SessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: string
        ipAddress:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    TranslationStatusResponse:
      type: object
      properties:
        pageId:
          type: string
          format: uuid
        sectionSlug:
          type: string
        pageSlug:
          type: string
        locale:
          type: string
        published:
          type: boolean
        stale:
          type: boolean
    RoleResponse:
      type: object
      properties:
        key:
          type: string
        rank:
          type: integer
          format: int32
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        accountCount:
          type: integer
          format: int32
    VersionSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        locale:
          type: string
        status:
          type: string
        title:
          type: string
        versionNo:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
  securitySchemes:
    cookieAuth:
      type: apiKey
      description: "Backend-issued session cookie, set by POST /api/v1/auth/google\
        \ (Keycloak-brokered Google sign-in, ADR-013) or POST /api/v1/auth/login-password\
        \ (ADR-014). httpOnly, so it is never readable from JavaScript and never appears\
        \ in a response body. Role is read from the account row on every request and\
        \ is not carried in this value."
      name: coc_session
      in: cookie
