# Coc Docs Platform — build and test both services.
#
# Runs on every push to any branch, and on every PR into dev or main.
#
# Both, because they check different things. A push run builds the branch as
# it stands -- the fast signal you want before opening anything. A PR run
# builds the MERGE RESULT, the branch combined with its target, which is the
# only thing that catches a branch and its base being fine apart and broken
# together. These are also the checks that make "PR must pass" mean something:
# without them, branch protection only enforces that somebody clicked a button.
#
# The security workflow (gitleaks, dependency scan, SAST) is separate —
# see security-audit.yml, the L2 hook from HARNESS-PROCESS-STANDARD §5.4.

name: CI

on:
  # No branch filter. This filter names the branch being pushed TO, so
  # [main, dev] meant a feature branch built nothing at all -- and the
  # pre-push hook refuses direct pushes to main and dev, which left it
  # matching almost nothing in practice. Errors should be visible on the
  # branch, before a PR exists.
  push:
  pull_request:
    branches: [main, dev]

# One run per ref. Pushing again supersedes the run already in flight instead
# of queueing behind it. Push and pull_request events carry different refs, so
# this never cancels a merge-result check on behalf of a branch check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend — Java 21 · Spring Boot · Maven
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to 21 deliberately. CONST-TECH-06 specifies Java 21, and the
      # Maven Enforcer rule in the pom fails the build on anything else —
      # RISK-020, after one developer reported Java 25 on day one.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Frontend — Next.js · Node 24
  # Skips cleanly until the frontend is a real npm project.
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there a frontend project yet?
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not present yet — nothing to build."
          fi

      - name: Set up Node 24
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Harness self-check — do the workflows only run paths that exist?
  #
  # Added after security-audit.yml shipped a build step calling ./mvnw, a
  # wrapper never committed here. It was valid YAML, so nothing caught it;
  # every PR burned a CodeQL minute then failed on a missing file. Seconds
  # of checking here, instead of a developer reading Actions logs.
  # ─────────────────────────────────────────────────────────────
  harness:
    name: Harness (workflow paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Workflows execute only paths that exist
        run: bash scripts/check-workflow-paths.sh

  # ─────────────────────────────────────────────────────────────
  # Single required check for branch protection.
  # Point the protection rule at THIS job, not at the ones above —
  # then adding or renaming a job never means editing the rule.
  # ─────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend, harness]
    if: always()
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          FAILED=0
          for r in "backend=${{ needs.backend.result }}" "frontend=${{ needs.frontend.result }}" "harness=${{ needs.harness.result }}"; do
            name="${r%%=*}"; result="${r#*=}"
            # 'skipped' is acceptable — the frontend job skips until the project exists.
            # Anything else that is not success blocks the merge.
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "CI FAIL — ${name}: ${result}"
              FAILED=1
            else
              echo "ok — ${name}: ${result}"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "CI failed — blocking merge"
            exit 1
          fi
          echo "CI PASS"
