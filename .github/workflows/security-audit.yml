# Security Hook L2 — CI Security Audit (GitHub Actions)
# This standard (HARNESS-PROCESS-STANDARD.md §5.4), stage L2
#
# Usage:
#   Copy this file to .github/workflows/security-audit.yml
#   For GitLab CI, convert to .gitlab-ci.yml format (same structure)

name: Security Audit (L2 Hook)

on:
  # No branch filter, matching ci.yml. This filter names the branch being
  # pushed TO, so [main, dev] meant a feature branch was never scanned until
  # a PR existed -- which is the wrong moment to first learn a secret was
  # committed, because by then it is already on the remote and shared.
  push:
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 2 * * 1"  # Scheduled scan every Monday at 02:00

# One run per ref; a newer push supersedes the scan already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Listing permissions explicitly sets every scope NOT listed to 'none'.
# codeql-action/analyze reads its own workflow run via the Actions API
# (GET /repos/{owner}/{repo}/actions/runs/{run_id}) while post-processing the
# SARIF, so without `actions: read` the analysis completes and then fails on
# upload with "Resource not accessible by integration". `packages: read` is
# the documented companion — CodeQL resolves query packs over it.
permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read
  packages: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Secret scan (gitleaks)
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to scan full history

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: hooks/gitleaks.toml

  # ─────────────────────────────────────────────────────────────
  # 2. Dependency vulnerability scan (OWASP Dependency Check)
  # ─────────────────────────────────────────────────────────────
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "${{ github.event.repository.name }}"
          path: "."
          format: "HTML"
          out: "reports"
          args: >-
            --enableRetired
            --failOnCVSS 7

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # ─────────────────────────────────────────────────────────────
  # 2b. Supply chain — SBOM generation + OSS licenses + dependency pin verification
  # ─────────────────────────────────────────────────────────────
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (Syft / CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: OSS license check (block prohibited licenses)
        run: |
          set -euo pipefail
          # The project defines an ALLOWED/DENIED license policy.
          # The build fails if a prohibited license (e.g., AGPL-3.0, SSPL, commercially incompatible) is found.
          DENYLIST="${HARNESS_LICENSE_DENYLIST:-AGPL-3.0,SSPL-1.0,BUSL-1.1}"
          echo "Denied licenses: ${DENYLIST}"
          if grep -Eio "$(echo "$DENYLIST" | sed 's/,/|/g')" sbom.cyclonedx.json; then
            echo "Prohibited OSS license found — blocking build (this standard §5.5)"
            exit 1
          fi
          echo "License check PASS"

      - name: Dependency pinning / lockfile verification
        run: |
          set -euo pipefail
          # Checks for the presence and tampering of the lockfile (e.g., pinned versions in pom.xml / package-lock.json / poetry.lock / go.sum).
          # The project registers the lockfile path in HARNESS_LOCKFILE.
          LOCK="${HARNESS_LOCKFILE:-}"
          if [ -n "$LOCK" ] && [ ! -f "$LOCK" ]; then
            echo "Lockfile ($LOCK) missing — supply chain integrity not ensured, blocking"
            exit 1
          fi
          echo "Dependency pin check complete (lockfile: ${LOCK:-not specified})"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ─────────────────────────────────────────────────────────────
  # 3. SAST (CodeQL)
  # ─────────────────────────────────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [java]  # Register all §5.7 organization-standard languages — e.g., [java, python, javascript, cpp]

    steps:
      - uses: actions/checkout@v4

      # Must come before CodeQL init so the analysis traces a Java 21 build.
      # Pinned for the same reason as ci.yml: CONST-TECH-06, and the pom's
      # maven-enforcer requireJavaVersion rule fails the build on anything else.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      # The Maven wrapper is not checked in, and the pom is in backend/ —
      # so use the runner's mvn from that directory, as ci.yml does.
      - name: Build (Java)
        working-directory: backend
        run: mvn -B --no-transfer-progress -DskipTests package

      # Code scanning — the Security tab — requires GitHub Advanced Security,
      # which is not available on a private repository owned by a personal
      # Free account. This is the same wall that stopped branch rulesets.
      #
      # The analysis itself succeeds; only the upload fails:
      #   "Code scanning is not enabled for this repository"
      #
      # So the results stay in the job. CodeQL still runs, with the same two
      # query suites, and the gate below reads its SARIF instead of GitHub
      # reading it for us. What is lost is the Security tab, alert triage and
      # dismissal history — not the analysis.
      #
      # If this repo moves to an organisation with GHAS: delete the two `with:`
      # lines and the gate step, and the alerts appear in the Security tab
      # again with no other change.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: never          # documented value; `false` is the legacy spelling
          output: sarif-results

      # Fail on what CodeQL found, at the same CVSS threshold dependency-check
      # uses (7.0), so "high" means one thing across this workflow.
      - name: Gate on CodeQL findings
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-results/*.sarif)

          # No SARIF means the analysis did not produce results — which is a
          # broken gate, not a clean one. A SAST step that passes when it did
          # not run is worse than no step at all.
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SARIF produced in sarif-results/ — CodeQL did not complete."
            exit 1
          fi

          THRESHOLD=7.0
          total=0
          blocking=0

          for f in "${files[@]}"; do
            echo "== $f"
            while IFS=$'\t' read -r sev rule loc msg; do
              total=$((total+1))
              if awk -v a="$sev" -v b="$THRESHOLD" 'BEGIN{exit !(a>=b)}'; then
                blocking=$((blocking+1))
                printf '  BLOCK  %-5s %s\n         %s\n         %s\n' "$sev" "$rule" "$loc" "$msg"
              else
                printf '  note   %-5s %s  %s\n' "$sev" "$rule" "$loc"
              fi
            done < <(jq -r '
              .runs[] as $run
              | $run.results[]?
              | . as $r
              | (($run.tool.driver.rules[]? | select(.id == $r.ruleId)) // {}) as $rule
              | [ (($rule.properties["security-severity"]) // "0")
                , ($r.ruleId // "unknown")
                , ((($r.locations[0].physicalLocation.artifactLocation.uri) // "?")
                   + ":" + ((($r.locations[0].physicalLocation.region.startLine) // 0) | tostring))
                , (($r.message.text) // "") ]
              | @tsv' "$f")
          done

          echo
          echo "CodeQL: ${total} result(s), ${blocking} at or above CVSS ${THRESHOLD}"
          if [ "$blocking" -gt 0 ]; then
            echo "SAST FAILED — download the sarif artifact for full detail."
            exit 1
          fi
          echo "SAST PASSED"

      # Keep the SARIF regardless of the gate's verdict: without the Security
      # tab this artifact is the only record of what the scan saw.
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # 4. Automated run of the security-auditor agent (Claude / Codex)
  # ─────────────────────────────────────────────────────────────
  # Skips cleanly until the AI audit is wired up, the same way ci.yml skips the
  # frontend until frontend/package.json exists. Set the HARNESS_AI_AUDIT_SCRIPT
  # repository variable (and the ANTHROPIC_API_KEY secret) and this job starts
  # running and blocking on its own — no edit to this file required.
  #
  # The in-job guards below still fail hard once the variable IS set: a
  # configured audit that cannot run is a failure, not a skip.
  security-auditor-agent:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.HARNESS_AI_AUDIT_SCRIPT != ''
    steps:
      - uses: actions/checkout@v4

      - name: Run security-auditor agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARNESS_AI_AUDIT_SCRIPT: ${{ vars.HARNESS_AI_AUDIT_SCRIPT }}
          HARNESS_AI_AUDIT_CMD: ${{ vars.HARNESS_AI_AUDIT_CMD }}
          HARNESS_AI_AUDIT_OUTPUT: security/audit-pr-${{ github.event.pull_request.number }}.md
          HARNESS_PR_BASE_REF: ${{ github.base_ref }}
          HARNESS_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Applies the security-auditor definition from this standard's .claude/agents/security-auditor.md.
          # The project must register the "path to a checked-in executable script"
          # in the HARNESS_AI_AUDIT_SCRIPT repository variable. (e.g., hooks/run-security-auditor.sh)
          # The script uses HARNESS_PR_BASE_REF / HARNESS_PR_NUMBER / HARNESS_AI_AUDIT_OUTPUT
          # to safely invoke the required AI CLI (Claude/Codex, etc.).
          if [ -n "${HARNESS_AI_AUDIT_CMD:-}" ] && [ -z "${HARNESS_AI_AUDIT_SCRIPT:-}" ]; then
            echo "HARNESS_AI_AUDIT_CMD is no longer executed directly."
            echo "Create a checked-in wrapper script and switch to HARNESS_AI_AUDIT_SCRIPT."
            exit 1
          fi
          if [ -z "${HARNESS_AI_AUDIT_SCRIPT:-}" ]; then
            echo "HARNESS_AI_AUDIT_SCRIPT is not set — the AI security-auditor audit cannot pass in TODO state, so L2 is blocked."
            exit 1
          fi
          case "${HARNESS_AI_AUDIT_SCRIPT}" in
            *[!A-Za-z0-9._/-]*)
              echo "HARNESS_AI_AUDIT_SCRIPT value is not a safe file path format: ${HARNESS_AI_AUDIT_SCRIPT}"
              exit 1
              ;;
          esac
          if [ ! -f "${HARNESS_AI_AUDIT_SCRIPT}" ]; then
            echo "AI audit script not found: ${HARNESS_AI_AUDIT_SCRIPT}"
            exit 1
          fi
          if [ ! -x "${HARNESS_AI_AUDIT_SCRIPT}" ]; then
            echo "AI audit script is not executable: ${HARNESS_AI_AUDIT_SCRIPT}"
            exit 1
          fi
          mkdir -p security
          echo "Running ${HARNESS_AI_AUDIT_SCRIPT}..."
          "${HARNESS_AI_AUDIT_SCRIPT}"

      - uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security/

  # ─────────────────────────────────────────────────────────────
  # 5. Final verdict — if this job fails, PR merge is blocked
  # ─────────────────────────────────────────────────────────────
  l2-verdict:
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, supply-chain, sast, security-auditor-agent]
    if: always()
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          FAILED=0

          # Jobs that must run and succeed on every trigger.
          for job_result in \
            "secret-scan=${{ needs.secret-scan.result }}" \
            "dependency-scan=${{ needs.dependency-scan.result }}" \
            "supply-chain=${{ needs.supply-chain.result }}" \
            "sast=${{ needs.sast.result }}"; do
            name="${job_result%%=*}"
            result="${job_result#*=}"
            if [ "$result" != "success" ]; then
              echo "L2 FAIL — ${name}: ${result}"
              FAILED=1
            fi
          done

          # security-auditor-agent is gated to pull_request events AND to the
          # HARNESS_AI_AUDIT_SCRIPT variable being set (see job 4).
          # Any non-success result other than 'skipped' still blocks.
          AGENT_RESULT="${{ needs.security-auditor-agent.result }}"
          AGENT_CONFIGURED="${{ vars.HARNESS_AI_AUDIT_SCRIPT != '' }}"
          if [ "$AGENT_RESULT" != "success" ] && [ "$AGENT_RESULT" != "skipped" ]; then
            echo "L2 FAIL — security-auditor-agent: ${AGENT_RESULT}"
            FAILED=1
          fi
          if [ "$AGENT_RESULT" = "skipped" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "L2 NOTE — security-auditor-agent skipped (event: ${{ github.event_name }}, PR-only job)"
            elif [ "$AGENT_CONFIGURED" = "true" ]; then
              # Configured but skipped on a PR — that should not be reachable.
              echo "L2 FAIL — security-auditor-agent was skipped on a pull_request while HARNESS_AI_AUDIT_SCRIPT is set"
              FAILED=1
            else
              echo "L2 NOTE — security-auditor-agent not configured: HARNESS_AI_AUDIT_SCRIPT is unset, so the AI audit did not run."
              echo "L2 NOTE — the other four L2 jobs still gate this PR. Set that repository variable to make the AI audit mandatory."
            fi
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "L2 security hook failed — blocking PR merge"
            echo "See this standard §5.4"
            exit 1
          fi
          echo "L2 security hook PASS"
