<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About this document — Redesign Mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8f9fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    /* ── Card ── */
    .card {
      width: 480px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(99, 102, 241, 0.08), 0 1px 4px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    /* ── Header bar ── */
    .card-header {
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-header svg {
      flex-shrink: 0;
      opacity: 0.92;
    }

    .card-header-label {
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* ── Rows ── */
    .rows {
      padding: 4px 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row-icon svg {
      width: 16px;
      height: 16px;
      color: #6b7280;
    }

    .row-label {
      flex: 1;
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
    }

    .row-value {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Status pill ── */
    .pill-success {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #dcfce7;
      color: #16a34a;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #bbf7d0;
    }

    .pill-success svg {
      width: 12px;
      height: 12px;
    }

    /* ── Content type pill ── */
    .pill-purple {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ede9fe;
      color: #6366f1;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #ddd6fe;
    }

    /* ── Time value with sub-label ── */
    .time-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }

    .time-main {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
    }

    .time-sub {
      font-size: 11px;
      font-weight: 400;
      color: #9ca3af;
    }

    /* ── Path chip ── */
    .path-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 5px 10px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11.5px;
      color: #6366f1;
      font-weight: 500;
      max-width: 260px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .copy-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .copy-btn:hover { color: #6366f1; }

    /* ── Footer ── */
    .card-footer {
      border-top: 1px solid #f3f4f6;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-hint {
      font-size: 12px;
      color: #9ca3af;
    }

    .footer-link {
      font-size: 12px;
      font-weight: 500;
      color: #9ca3af;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }

    .footer-link:hover { color: #6366f1; }
  </style>
</head>
<body>

  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <!-- Document icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span class="card-header-label">Document info</span>
    </div>

    <!-- Rows -->
    <div class="rows">

      <!-- Status -->
      <div class="row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
        <span class="row-label">Status</span>
        <div class="row-value">
          <span class="pill-success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Has content
          </span>
        </div>
      </div>

      <!-- Last updated -->
      <div class="row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <span class="row-label">Last updated</span>
        <div class="row-value">
          <div class="time-wrap">
            <span class="time-main">1h ago</span>
            <span class="time-sub">Updated today</span>
          </div>
        </div>
      </div>

      <!-- Content type -->
      <div class="row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </div>
        <span class="row-label">Content type</span>
        <div class="row-value">
          <span class="pill-purple">Steps</span>
        </div>
      </div>

      <!-- Path -->
      <div class="row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <span class="row-label">Path</span>
        <div class="row-value">
          <div class="path-chip">
            /docs/usage/setup-guide
            <button class="copy-btn" title="Copy path">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="card-footer">
      <span class="footer-hint">Coc Docs Platform</span>
      <a href="#" class="footer-link">
        View history
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
    </div>

  </div>

</body>
</html>
